# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production: &production
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  trim_idle_sessions:
    class: SessionTrimJob
    queue: background
    schedule: every hour at minute 27
  rollup_impressions:
    class: RollupImpressionsJob
    queue: background
    schedule: every hour at minute 42
  rollup_container_impressions:
    class: RollupContainerImpressionsJob
    queue: background
    schedule: every day at 4:10am
  # Runs after the nightly rollups, so the day it sums up has settled.
  # Re-runnable by hand with `rake admin:digest[YYYY-MM-DD]`; a partial unique
  # index keeps a day to one digest however many times it fires.
  daily_digest:
    class: DailyDigestJob
    queue: background
    schedule: every day at 5:05am
  reclassify_user_agents:
    class: ReclassifyUserAgentsJob
    queue: background
    schedule: every day at 4:00am
  # The zone is required: fugit reads a bare time in the process's system zone,
  # not config.time_zone, and a UTC container would fire at 20:15 Eastern the
  # evening before anything new has lapsed.
  record_embargo_releases:
    class: EmbargoReleaseJob
    queue: background
    schedule: every day at 12:15am America/New_York

# Solid Queue reads the file whole when it has no key for the current env, and
# builds tasks only from entries with a schedule, so staging would otherwise
# start its scheduler with no tasks and no error.
staging: *production
