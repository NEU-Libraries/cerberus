en:
  blacklight:
    application_name: 'DRS'
    search:
      # "Displaying 1 to 10 of 8,065" — overrides Blacklight's terser
      # "1 - 10 of 8065" to match the DRS-v1 results-count wording shown in
      # the pagination bar (_results_pagination_bar). <strong> keeps the
      # numerals emphasised against the muted label text.
      pagination_info:
        no_items_found: 'No %{entry_name} found'
        single_item_found: 'Displaying <strong>1</strong> %{entry_name}'
        pages:
          one: 'Displaying <strong>%{start_num}</strong> to <strong>%{end_num}</strong> of <strong>%{total_num}</strong>'
          other: 'Displaying <strong>%{start_num}</strong> to <strong>%{end_num}</strong> of <strong>%{total_num}</strong>'
      facets:
        # Blacklight's own label is a bare "more »", which reads as a fragment
        # next to the facet values above it and gives a screen reader nothing to
        # act on. The field name stays visually hidden, so the accessible name
        # is "See more Topic" while the sighted label stays short.
        more_html: 'See more <span class="visually-hidden">%{field_name}</span>'
      zero_results:
        # Blacklight's own wording ends "then refine your search using the links
        # on the left". On a zero-result search the facet panel still renders,
        # heading and all, but every facet is empty — a term that matched nothing
        # has nothing to narrow — so it sends the reader to look at a panel with no
        # links in it. Advice that names a control the screen does not offer is
        # worse than no advice: it reads as the page being broken.
        use_fewer_keywords: 'Try fewer or more general keywords — a narrower term has nothing left to filter.'
