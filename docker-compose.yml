# Use postgres/example user/password credentials
volumes:
  solr:
  db:
  storage:
  iiif:
  iiif-cache:
  uploads:
  handle-data:
services:
  db:
    # TimescaleDB is a Postgres extension; this image is vanilla Postgres 14
    # plus the extension available-but-inactive (no CREATE EXTENSION until a
    # migration runs it, and only in Cerberus's logical DB — Atlas's logical DB
    # on this shared service is untouched). The non-`ha` image is a true drop-in:
    # it honors the same PGDATA/entrypoint as postgres:14, so the existing `db`
    # volume mounts cleanly with no re-init. (The `-ha` image uses a different
    # data dir/user and would orphan this volume — do not use it here.)
    image: timescale/timescaledb:2.17.2-pg14
    # The extension must be preloaded at server start. The image only injects
    # this into postgresql.conf when it initialises a *fresh* data dir; because
    # we reuse the existing postgres:14 volume, we pass it as a server flag
    # instead. Inert for Atlas's logical DB (which never CREATEs the extension).
    command: postgres -c shared_preload_libraries=timescaledb
    volumes:
      - db:/var/lib/postgresql/data/pgdata
    restart: always
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD: example
    ports:
      - 5432:5432
    # Nothing here is slow to start, but Postgres accepts connections a moment
    # after its container does, and the services below prepare their databases
    # on boot. Without a gate, whichever of them wins the race asks a socket
    # that is not listening yet, gives up, and then serves 500s for the life of
    # the stack -- a caller sees "We could not find your database", which reads
    # as a missing database rather than a service that started too early.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    image: nakatomi/cerberus_web
    depends_on:
      db:
        condition: service_healthy
    entrypoint: /home/cerberus/web/docker-entrypoint.sh
    environment:
      ATLAS_URL: 'http://atlas:3000/'
      # Container-internal Cantaloupe route for server-side info.json reads
      # (IiifManifest dimensions); browsers keep using the public iiif_host.
      CERBERUS_IIIF_INTERNAL_HOST: ${CERBERUS_IIIF_INTERNAL_HOST:-}
      # Resolver a minted handle is linked against on the Work page. Defaults to
      # the sibling handle service rather than to CNRI's global proxy: this
      # stack mints under an unregistered prefix, which is in no Global Handle
      # Registry, so hdl.handle.net cannot answer for it and every dev link
      # would look broken. Both ends run the same CNRI proxy, so the local one
      # is a true rehearsal. Production sets this to the global proxy.
      HANDLE_RESOLVER_BASE: ${HANDLE_RESOLVER_BASE:-http://localhost:8000}
    ports:
      - 3000:3000
  atlas:
    image: nakatomi/atlas_web:${ATLAS:-latest}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: /home/atlas/web/docker-entrypoint.sh
    environment:
      RAILS_MASTER_KEY: ${ATLAS_RAILS_MASTER_KEY}
      # Handle minting. Atlas owns the client and the admin credential; Cerberus
      # only reads the handle back off the Work. The client is inert unless the
      # URL, prefix and secret are all set, and an unminted Work is a supported
      # state — /complete succeeds either way.
      HANDLE_SERVER_URL: ${HANDLE_SERVER_URL:-https://handle:8000}
      HANDLE_PREFIX: ${HANDLE_PREFIX:-DRSDEV}
      # This default MUST match the handle service's ADMIN_SECRET below. They
      # are the two ends of one credential: leave this empty while the server
      # has a value and Atlas cannot authenticate a write, so it silently mints
      # nothing — a stack that looks healthy and produces no handles.
      HANDLE_ADMIN_SECRET: ${HANDLE_ADMIN_SECRET:-cerberus-dev-handle-admin}
      # The handle server's certificate is self-signed CN=anonymous with no SAN,
      # so no hostname verifies against it and a CA bundle is no help. Left
      # unset elsewhere, so a real certificate is verified normally.
      HANDLE_SSL_VERIFY: 'false'
      # Where a handle sends a reader. Atlas does not know Cerberus's public
      # host, so it arrives as config.
      CERBERUS_PUBLIC_BASE: ${CERBERUS_PUBLIC_BASE:-http://localhost:3000}
      # Atlas writes the citable URL, not the bare handle, into the MODS `hdl`
      # identifier, so it needs the resolver too. Its own default is the global
      # proxy, which is right for production and wrong here — an unregistered
      # prefix is in no registry. Shares one value with the web service above,
      # or the Work page header and the metadata table name different hosts for
      # the same object.
      HANDLE_RESOLVER_BASE: ${HANDLE_RESOLVER_BASE:-http://localhost:8000}
    ports:
      - 3001:3000
  atlas-test:
    image: nakatomi/atlas_web:${ATLAS:-latest}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: /home/atlas/web/docker-entrypoint.sh
    # Deliberately given none of the HANDLE_* / CERBERUS_PUBLIC_BASE variables
    # above. Atlas mints only when a client is configured, so withholding them
    # is what keeps the suite from writing live records into a handle server —
    # a spec that finalizes a Work would otherwise mint one every run.
    environment:
      RAILS_ENV: 'test'
      RAILS_MASTER_KEY: ${ATLAS_RAILS_MASTER_KEY}
    ports:
      - 3002:3000
  handle:
    # Handle.Net server (independent-service mode, unregistered local prefix).
    # Built from ~/projects/cerberus-handles, whose README is the reference.
    #
    # An ordinary service, started by a plain `up` like every other one. It was
    # briefly opt-in behind a compose profile; that made the default dev stack
    # one where no Work is ever minted, so the whole path went unexercised
    # unless someone remembered a flag — and profiles are excluded from `down`
    # as well as `up`, so the container outlived the stack it belonged to.
    image: nakatomi/cerberus-handles:9.3.2
    # Listed variable by variable rather than through `env_file: .env`. That
    # keeps unrelated Cerberus config out of the container, and — the sharper
    # reason — the IMAGE's defaults are not the defaults in cerberus-handles'
    # .env.example: omit STORAGE_TYPE and SQL_URL and the server falls back to
    # the embedded BDB-JE store, which skips the admin seed. Reads and homing
    # still work, so it looks fine until the first write, which can then never
    # authenticate.
    environment:
      HANDLE_PREFIX: ${HANDLE_PREFIX:-DRSDEV}
      # The admin identity must name the same prefix or it is not
      # authoritative for it — hence the one variable in both places.
      SERVER_ADMINS: "300:${HANDLE_PREFIX:-DRSDEV}/ADMIN"
      # Renamed on the way in: a bare ADMIN_SECRET in Cerberus's .env reads as
      # Cerberus's own. The server refuses to boot on an empty one, which as an
      # always-on service would fail a plain `up` for anyone who has not set it
      # — hence the dev fallback. It authenticates administrative writes to a
      # local, unregistered handle store, so a known value costs nothing here.
      # This file is developer-only; staging and production are Swarm stacks
      # that carry their own secret. Do not promote this default to either.
      ADMIN_SECRET: ${HANDLE_ADMIN_SECRET:-cerberus-dev-handle-admin}
      STORAGE_TYPE: sql
      SQL_URL: jdbc:sqlite:/var/handle/svr/handles.db
      SQL_DRIVER: org.sqlite.JDBC
    ports:
      # HTTP and HTTPS are port-unified: reads answer over plain HTTP,
      # administrative writes need TLS on this same port. The native Handle
      # protocol (2641/tcp+udp) stays on the compose network — publish it only
      # if you want the hdl-* tools from the host.
      - 8000:8000/tcp
    volumes:
      # Config and the server keypair regenerate from the environment on every
      # boot, so this carries only the handle store and the seeded admin
      # record. Wiping it is a full reset.
      - handle-data:/var/handle/svr
  iiif:
    image: uclalibrary/cantaloupe:5.0.6-2
    ports:
      - 8182:8182
    environment:
      CANTALOUPE_PROCESSOR_MANUALSELECTIONSTRATEGY_JP2: 'OpenJpegProcessor'
      CANTALOUPE_PROCESSOR_SELECTION_STRATEGY: 'ManualSelectionStrategy'
      CANTALOUPE_CACHE_CLIENT_ENABLED: 'true'
      # Server-side derivative cache: re-serve processed tiles/derivatives from
      # disk instead of re-decoding the source JP2 on every request (the client
      # cache above only sets browser Cache-Control headers — no server effect).
      # The info cache is on by default. Persisted to the iiif-cache volume so it
      # survives container recreation. Gated deep-zoom identifiers rotate ~daily
      # (IiifSigner quantizes their expiry to a stable window), so their cache
      # entries orphan over time — the finite TTL plus the background worker reap
      # them; lower the TTL if the cache volume grows too large.
      CANTALOUPE_CACHE_SERVER_DERIVATIVE_ENABLED: 'true'
      CANTALOUPE_CACHE_SERVER_DERIVATIVE: 'FilesystemCache'
      CANTALOUPE_FILESYSTEMCACHE_PATHNAME: /var/cache/cantaloupe
      CANTALOUPE_CACHE_SERVER_DERIVATIVE_TTL_SECONDS: '2592000'
      CANTALOUPE_CACHE_SERVER_WORKER_ENABLED: 'true'
    volumes:
      - iiif-cache:/var/cache/cantaloupe
  solr:
    image: nakatomi/blacklight-solr
    ports:
    - 8983:8983
    volumes:
    - solr:/var/solr/data/blacklight-core/data
    environment:
      SOLR_LOG_LEVEL: 'WARN'
    healthcheck:
      test:
      - CMD
      - wget
      - "-O"
      - "/dev/null"
      - http://localhost:8983/solr/
      interval: 30s
      timeout: 5s
      retries: 3
  selenium:
    # Headless Chrome for the browser spec lane. Capybara drives it over the
    # remote WebDriver protocol, so no browser and no chromedriver is installed
    # in the web image — which matters because that image is the one published
    # and deployed, and a browser has no business in it.
    #
    # The tag tracks the selenium-webdriver version in Gemfile.lock. Client and
    # server negotiate the same W3C protocol across a version gap, but holding
    # both ends on one minor removes the gap as a suspect when a session fails
    # to start.
    image: selenium/standalone-chrome:4.10
    # Behind a profile so an ordinary `up` never starts it: the browser is only
    # needed while the browser specs run, and it is the heaviest service here
    # per unit of use.
    profiles:
      - test
    # Chrome maps its renderer heap into /dev/shm, and Docker's 64 MB default is
    # far under what a page needs. Exhausting it aborts the tab, which surfaces
    # as "session deleted because of page crash" rather than as a memory error.
    shm_size: 1gb
    healthcheck:
      test:
      - CMD
      - curl
      - "-f"
      - http://localhost:4444/status
      interval: 10s
      timeout: 5s
      retries: 5
